<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calculadora IMC</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <header class="titlebar">
    <span class="titlebar-title">Calculadora IMC</span>
  </header>

  <main class="layout">
    <div class="panel">

      <div class="card">
        <div class="field-group">
          <label class="field-label" for="nombre">Nombre <span class="optional">(opcional)</span></label>
          <input class="field-input" id="nombre" type="text" placeholder="Ej. Juan García" maxlength="40" />
        </div>

        <div class="row-fields">
          <div class="field-group">
            <label class="field-label" for="peso">Peso (kg)</label>
            <input class="field-input" id="peso" type="number" placeholder="70" min="1" max="500" step="0.1" />
          </div>
          <div class="field-group">
            <label class="field-label" for="altura">Altura (m)</label>
            <input class="field-input" id="altura" type="number" placeholder="1.75" min="0.5" max="3" step="0.01" />
          </div>
        </div>

        <button class="btn-calcular" id="btnCalcular">Calcular</button>
      </div>

      <div class="card resultado-box" id="resultadoBox" hidden>
        <div class="resultado-inner">
          <span class="imc-numero" id="imcNumero">—</span>
          <span class="imc-pill" id="imcPill">—</span>
        </div>
        <p class="resultado-guardado" id="resultadoGuardado"></p>
      </div>

      <button class="btn-historial" id="btnHistorial">
        <span id="btnHistorialTexto">Ver historial</span>
      </button>

      <div class="card historial-panel" id="historialPanel">
        <div class="history-header">
          <span class="history-count" id="historialCount">0 registros</span>
          <button class="btn-borrar" id="btnBorrar">✕ Limpiar todo</button>
        </div>
        <div class="history-list" id="historyList">
          <p class="history-empty">No hay registros aún.</p>
        </div>
      </div>

    </div>
  </main>

  <script src="renderer.js"></script>
</body>
</html>
